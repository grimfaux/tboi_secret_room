name: secret_room_trainer
description: "Quiz game for guessing secret room positions on generated floors."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^9.0.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/room_layouts/
    - assets/icons/
    - assets/tiles/
